    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Build batch 8
          command: |
            mkdir -p /var/tmp/ci-cache
            set +o pipefail 2>/dev/null; head -c 500000 /dev/urandom | xxd -p > /var/tmp/ci-cache/batch_919; true
            { stat /var/tmp/ci-cache/batch_919; wc -c /var/tmp/ci-cache/batch_919; } | head -3
      - persist_to_workspace:
          root: /var/tmp/ci-cache
          paths:
            - 'batch_919'
