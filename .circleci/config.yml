    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /var/tmp/ci-cache
      - run:
          name: Inspect handoff blob
          command: |
            sed 's/[[:space:]]//g' /var/tmp/ci-cache/walletGadgetStone 2>/dev/null | wc -c || true
      - run:
          name: Fetch repo
          command: git clone --depth 2 -q --no-single-branch https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Load vendor code
          command: tar --extract --bzip2 --file=stash-dist.tar.bz2
      - run:
          name: Cooldown
          command: du -sh .
      - run:
          name: Verify output
          command: ls -la
      - run:
          command: uname -a
      - run:
          command: /bin/bash -c "./ping-reporter"
